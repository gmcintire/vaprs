[package]
name = "vaprs"
version = "0.1.22"
edition = "2021"
description = "APRS iGate and digipeater"
license = "GPL-2.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "signal", "sync", "macros", "fs"] }
tokio-serial = "5"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Graham <graham@example.com>"
section = "hamradio"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/vaprs", "usr/sbin/", "755"],
    ["config/vaprs.toml.example", "etc/vaprs/vaprs.toml", "644"],
    ["debian/vaprs.service", "lib/systemd/system/", "644"],
    ["debian/vaprs.default", "etc/default/vaprs", "644"],
    ["debian/vaprs.logrotate", "etc/logrotate.d/vaprs", "644"],
]
conf-files = ["/etc/vaprs/vaprs.toml", "/etc/default/vaprs"]
maintainer-scripts = "debian/"
