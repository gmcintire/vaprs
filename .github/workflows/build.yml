name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  build-native:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build release
        run: cargo build --release
      - name: Build .deb package
        run: cargo deb --no-build
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaprs-amd64.deb
          path: target/debian/*.deb

  build-arm64:
    name: Build (aarch64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build release
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Build .deb package
        run: cargo deb --no-build --target aarch64-unknown-linux-gnu
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaprs-arm64.deb
          path: target/aarch64-unknown-linux-gnu/debian/*.deb

  build-armv7:
    name: Build (armv7)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build release
        run: cargo build --release --target armv7-unknown-linux-gnueabihf
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      - name: Build .deb package
        run: cargo deb --no-build --target armv7-unknown-linux-gnueabihf
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaprs-armhf.deb
          path: target/armv7-unknown-linux-gnueabihf/debian/*.deb
