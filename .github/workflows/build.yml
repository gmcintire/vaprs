name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            use_cross: false
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            runner: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/bin/cargo-deb
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install cross
        if: matrix.use_cross
        run: command -v cross || cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install cargo-deb

      - name: Build release (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build .deb package
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaprs-${{ matrix.arch }}.deb
          path: target/${{ matrix.target }}/debian/*.deb

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true

  publish:
    name: Publish to APT repo
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          HOST=$(echo "$DEPLOY_HOST" | tr -d '[:space:]')
          ssh -vvv -i ~/.ssh/deploy_key "graham@${HOST}" echo "SSH OK"

      - name: Upload .deb packages
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          HOST=$(echo "$DEPLOY_HOST" | tr -d '[:space:]')
          for deb in $(find artifacts -type f -name '*.deb'); do
            scp -i ~/.ssh/deploy_key "$deb" "graham@${HOST}:apps/vaprs-incoming/"
          done

      - name: Import into APT repo
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          HOST=$(echo "$DEPLOY_HOST" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key "graham@${HOST}" ./import-debs.sh
